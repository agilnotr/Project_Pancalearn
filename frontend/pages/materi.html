<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B91C2C'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='800' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3EP%3C/text%3E%3C/svg%3E" />
<title>Materi Pancasila — PancaLearn</title>
<meta name="description" content="Jelajahi 20 materi Pancasila di PancaLearn: sejarah, makna 5 sila, nilai-nilai, dan penerapannya dalam kehidupan sehari-hari, lengkap dengan mini quiz." />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/navbar.css" />
<link rel="stylesheet" href="../css/materi.css" />
<link rel="stylesheet" href="../css/footer.css" />
</head>
<body>

<div id="navbar-mount"></div>

<main>
  <section class="page-header container">
    <span class="eyebrow">Belajar Terstruktur</span>
    <h1>Materi Pancasila</h1>
    <p>Pilih materi yang ingin kamu pelajari. Setiap materi dilengkapi ringkasan, contoh nyata, dan mini quiz.</p>
  </section>

  <section class="container">
    <div class="card card-static learn-progress" id="materi-progress"></div>

    <div class="materi-toolbar">
      <input type="search" id="materi-search" placeholder="Cari materi..." aria-label="Cari materi" autocomplete="off" />
      <select id="materi-filter" aria-label="Filter status materi">
        <option value="all">Semua Materi</option>
        <option value="done">Sudah Selesai</option>
        <option value="todo">Belum Dipelajari</option>
      </select>
    </div>
    <p class="materi-count caption" id="materi-count" aria-live="polite"></p>

    <div id="materi-groups"></div>
    <div class="empty-state hidden" id="materi-empty"></div>
  </section>
</main>

<div id="footer-mount"></div>

<script src="../js/data.js"></script>
<script src="../js/state.js"></script>
<script src="../js/main.js"></script>
<script src="../js/materi.js"></script>
</body>
</html>
